<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Khata - डिजिटल बहीखाता & वॉयस असिस्टेंट</title>
    <meta name="description" content="Smart Khata - दुकानदार भाइयों के लिए आधुनिक वॉयस आधारित डिजिटल उधारी खाता">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        khata: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '"Noto Sans Devanagari"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Pulse wave animation for recording */
        @keyframes pulse-ring {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            70% {
                transform: scale(1.03);
                box-shadow: 0 0 0 14px rgba(239, 68, 68, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }
        .mic-active {
            animation: pulse-ring 1.5s infinite cubic-bezier(0.4, 0, 0.6, 1);
            background-color: #ef4444 !important;
            border-color: #b91c1c !important;
            color: #ffffff !important;
        }

        /* Ambient subtle background glow */
        .ambient-glow {
            background: radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.15) 0%, rgba(248, 250, 252, 0) 70%);
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen font-sans flex items-center justify-center p-3 sm:p-5 ambient-glow text-slate-800">

    <!-- Mobile-First App Container -->
    <main class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/80 border border-slate-100 overflow-hidden flex flex-col transition-all duration-300">
        
        <!-- App Header with Branding & Status Indicator -->
        <header class="bg-gradient-to-r from-khata-700 via-khata-600 to-emerald-600 text-white p-5 pt-6 pb-6 relative">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 bg-white/15 backdrop-blur-md rounded-2xl flex items-center justify-center text-2xl shadow-inner border border-white/20">
                        📖
                    </div>
                    <div>
                        <h1 class="text-2xl font-extrabold tracking-tight flex items-center gap-1.5 leading-none">
                            Smart Khata
                        </h1>
                        <p class="text-xs font-medium text-emerald-100 mt-1 flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-emerald-300 inline-block animate-pulse"></span>
                            दुकानदार डिजिटल बहीखाता
                        </p>
                    </div>
                </div>
                
                <!-- Audio toggle helper indicator -->
                <button id="speakerToggle" title="आवाज़ (Voice Output) ऑन है" aria-label="स्पीकर स्थिति"
                    class="p-2.5 rounded-xl bg-white/15 border border-white/20 hover:bg-white/25 active:scale-95 transition text-emerald-100">
                    <svg id="speakerIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    </svg>
                </button>
            </div>
            
            <!-- Quick Chips / Examples -->
            <div class="mt-4 flex gap-1.5 overflow-x-auto pb-1 no-scrollbar text-[11px] font-medium text-emerald-100">
                <span class="opacity-75 whitespace-nowrap self-center">नमूना:</span>
                <button type="button" onclick="setQuickText('शर्मा जी ने 500 का सामान लिया उधार')" class="bg-black/15 hover:bg-black/25 px-2.5 py-1 rounded-full whitespace-nowrap transition border border-white/10 active:scale-95">
                    "शर्मा जी उधार ₹500"
                </button>
                <button type="button" onclick="setQuickText('राकेश का बैलेंस कितना है?')" class="bg-black/15 hover:bg-black/25 px-2.5 py-1 rounded-full whitespace-nowrap transition border border-white/10 active:scale-95">
                    "राकेश का बैलेंस?"
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <section class="p-5 flex flex-col gap-4">

            <!-- Input Card -->
            <div class="relative">
                <div class="flex justify-between items-center mb-1.5 px-1">
                    <label for="userInput" class="text-xs font-bold uppercase tracking-wider text-slate-500">
                        एंट्री लिखें या बोलें (Voice/Text)
                    </label>
                    <button id="clearBtn" onclick="clearInput()" type="button" class="text-xs font-semibold text-slate-400 hover:text-red-500 transition hidden">
                        साफ़ करें ✕
                    </button>
                </div>

                <div class="relative rounded-2xl border-2 border-slate-200 focus-within:border-khata-600 focus-within:ring-4 focus-within:ring-khata-100 transition-all bg-slate-50/50 hover:bg-white focus-within:bg-white overflow-hidden shadow-sm">
                    <textarea 
                        id="userInput" 
                        rows="4" 
                        class="w-full p-3.5 pb-8 text-base text-slate-800 placeholder-slate-400 bg-transparent resize-none border-none outline-none focus:ring-0 leading-relaxed font-medium"
                        placeholder="जैसे: Sharma ji ne 500 ka saman liya... ya 'Verma ji ka balance batao'"></textarea>

                    <!-- Recording Visual Wave Status Bar -->
                    <div id="listeningIndicator" class="hidden absolute bottom-2 left-3 right-3 flex items-center justify-between text-xs text-red-600 font-semibold bg-red-50/90 py-1 px-3 rounded-lg border border-red-100">
                        <span class="flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-red-600 animate-ping"></span>
                            सुन रहा हूँ... बोलिए (Listening...)
                        </span>
                        <span class="text-[10px] text-red-400 font-mono">हिन्दी / Hinglish</span>
                    </div>
                </div>
            </div>

            <!-- Action Buttons Stack / Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                <!-- Mic Button -->
                <button 
                    id="micBtn" 
                    type="button" 
                    onclick="toggleVoiceRecognition()"
                    class="h-13 py-3 px-4 rounded-2xl font-bold text-sm sm:text-base flex items-center justify-center gap-2.5 transition-all duration-200 active:scale-98 shadow-sm bg-blue-50 text-blue-700 hover:bg-blue-100/90 border border-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <span id="micIcon" class="text-xl leading-none">🎙️</span>
                    <span id="micLabel">बोल कर लिखें</span>
                </button>

                <!-- Primary Send Button -->
                <button 
                    id="sendBtn" 
                    type="button" 
                    onclick="sendData()"
                    class="h-13 py-3 px-4 rounded-2xl font-bold text-sm sm:text-base flex items-center justify-center gap-2.5 transition-all duration-200 active:scale-98 shadow-md shadow-khata-600/25 bg-khata-600 hover:bg-khata-700 text-white border border-khata-700 focus:outline-none focus:ring-2 focus:ring-khata-500">
                    <span id="sendIcon" class="text-lg leading-none">🚀</span>
                    <span id="sendLabel">खाते में भेजें</span>
                </button>
            </div>

            <!-- Loading Spinner State -->
            <div id="loader" class="hidden my-2 p-3.5 rounded-2xl bg-amber-50 border border-amber-200/80 text-amber-900 flex items-center justify-center gap-3 text-sm font-semibold transition-all">
                <svg class="animate-spin h-5 w-5 text-amber-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>खाते में दर्ज हो रहा है... कृपया प्रतीक्षा करें</span>
            </div>

            <!-- Dynamic Response Area (Success / Error Card) -->
            <div id="responseArea" class="hidden rounded-2xl p-4.5 border transition-all duration-300">
                <div class="flex items-start gap-3">
                    <div id="responseBadge" class="text-2xl flex-shrink-0 mt-0.5">✅</div>
                    <div class="flex-1">
                        <div class="flex items-center justify-between">
                            <span id="responseStatusTitle" class="text-xs font-bold uppercase tracking-wider">परिणाम (Result)</span>
                            <button id="speakAgainBtn" onclick="replayAudio()" type="button" title="दोबारा सुनें" class="text-xs px-2 py-0.5 rounded-full bg-white/70 hover:bg-white shadow-xs font-semibold flex items-center gap-1">
                                🔊 फिर से सुनें
                            </button>
                        </div>
                        <p id="responseText" class="mt-1 text-sm sm:text-base font-semibold leading-relaxed">
                            <!-- Injected dynamically -->
                        </p>
                    </div>
                </div>
            </div>

            <!-- Shopkeeper Quick Tips Footer / Safety note -->
            <div class="mt-2 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
                <span class="flex items-center gap-1 font-medium">
                    🛡️ सुरक्षित एवं त्वरित बहीखाता
                </span>
                <span class="font-mono text-[10px] bg-slate-100 px-2 py-0.5 rounded text-slate-500">v2.0 Voice-AI</span>
            </div>

        </section>
    </main>

    <!-- JavaScript Application Logic -->
    <script>
        /**
         * Smart Khata - Configuration & State
         */
        // Placeholder Webhook URL as required
        const WEBHOOK_URL = "https://flow.sokt.io/func/scri6YN7f3ar?sync=true";

        // Global state
        let recognition = null;
        let isListening = false;
        let lastMessageToSpeak = "";
        let hindiVoice = null;

        // DOM Elements
        const userInput = document.getElementById("userInput");
        const micBtn = document.getElementById("micBtn");
        const micLabel = document.getElementById("micLabel");
        const micIcon = document.getElementById("micIcon");
        const sendBtn = document.getElementById("sendBtn");
        const sendLabel = document.getElementById("sendLabel");
        const sendIcon = document.getElementById("sendIcon");
        const loader = document.getElementById("loader");
        const responseArea = document.getElementById("responseArea");
        const responseText = document.getElementById("responseText");
        const responseBadge = document.getElementById("responseBadge");
        const responseStatusTitle = document.getElementById("responseStatusTitle");
        const listeningIndicator = document.getElementById("listeningIndicator");
        const clearBtn = document.getElementById("clearBtn");

        // Input listener for showing/hiding clear button
        userInput.addEventListener("input", () => {
            clearBtn.classList.toggle("hidden", !userInput.value.trim());
        });

        function clearInput() {
            userInput.value = "";
            clearBtn.classList.add("hidden");
            userInput.focus();
        }

        function setQuickText(sampleText) {
            userInput.value = sampleText;
            clearBtn.classList.remove("hidden");
            userInput.focus();
        }

        /**
         * Initialize Speech Synthesis and pre-fetch Hindi voice
         */
        function initVoices() {
            if (!("speechSynthesis" in window)) return;
            
            const updateVoiceList = () => {
                const voices = window.speechSynthesis.getVoices();
                // Priority: 1. Exact hi-IN voice, 2. Any Hindi voice, 3. Indian English fallback, 4. Default
                hindiVoice = voices.find(v => v.lang === "hi-IN" || v.lang.startsWith("hi_IN") || v.lang.toLowerCase().includes("hindi")) 
                          || voices.find(v => v.lang === "en-IN")
                          || null;
            };

            updateVoiceList();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = updateVoiceList;
            }
        }
        initVoices();

        /**
         * Text-to-Speech (TTS) Implementation
         * Reads out the response received from webhook in Hindi
         */
        function speakMessage(text) {
            if (!("speechSynthesis" in window)) {
                console.warn("Speech synthesis not supported in this browser.");
                return;
            }

            if (!text || !text.trim()) return;
            lastMessageToSpeak = text;

            try {
                // Cancel previous audio to avoid overlapping
                window.speechSynthesis.cancel();

                // Clean string (strip emoji markers for cleaner speech pronunciation)
                const cleanText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2702}-\u{27B0}\u{24C2}-\u{1F251}✅❌🚀🎙️]/gu, '').trim();

                const utterance = new SpeechSynthesisUtterance(cleanText || text);
                utterance.lang = "hi-IN";
                utterance.rate = 0.95; // Slightly slower for crisp clarity
                utterance.pitch = 1.0;

                if (hindiVoice) {
                    utterance.voice = hindiVoice;
                }

                window.speechSynthesis.speak(utterance);
            } catch (err) {
                console.error("Audio playback error:", err);
            }
        }

        function replayAudio() {
            if (lastMessageToSpeak) {
                speakMessage(lastMessageToSpeak);
            }
        }

        /**
         * Speech-to-Text (STT) Voice Input Setup
         * Listens in Hindi/Hinglish (lang = 'hi-IN')
         */
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                return null;
            }

            const recog = new SpeechRecognition();
            recog.lang = "hi-IN";
            recog.continuous = false;
            recog.interimResults = false;
            recog.maxAlternatives = 1;

            recog.onstart = () => {
                isListening = true;
                micBtn.classList.add("mic-active");
                micIcon.innerText = "🔴";
                micLabel.innerText = "सुन रहा हूँ...";
                listeningIndicator.classList.remove("hidden");
            };

            recog.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                if (transcript) {
                    userInput.value = transcript;
                    clearBtn.classList.remove("hidden");
                }
            };

            recog.onerror = (event) => {
                console.error("Speech recognition error:", event.error);
                stopListeningUI();
                if (event.error === "not-allowed" || event.error === "service-not-allowed") {
                    showResponseState(false, "माइक्रोफ़ोन की अनुमति (Permission) नहीं मिली। कृपया ब्राउज़र सेटिंग्स में Mic Allow करें।");
                } else if (event.error === "network") {
                    showResponseState(false, "इंटरनेट नेटवर्क में समस्या है, कृपया टाइप करके भेजें।");
                }
            };

            recog.onend = () => {
                stopListeningUI();
            };

            return recog;
        }

        function stopListeningUI() {
            isListening = false;
            micBtn.classList.remove("mic-active");
            micIcon.innerText = "🎙️";
            micLabel.innerText = "बोल कर लिखें";
            listeningIndicator.classList.add("hidden");
        }

        function toggleVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("आपके ब्राउज़र में वॉइस सपोर्ट उपलब्ध नहीं है। कृपया Google Chrome का उपयोग करें।");
                return;
            }

            if (!recognition) {
                recognition = initSpeechRecognition();
            }

            if (!recognition) return;

            if (isListening) {
                recognition.stop();
                stopListeningUI();
            } else {
                try {
                    // Cancel any active speech output when listening
                    if (window.speechSynthesis) window.speechSynthesis.cancel();
                    recognition.start();
                } catch (err) {
                    console.error("Error starting speech recognition:", err);
                    stopListeningUI();
                }
            }
        }

        /**
         * Update Response Area with animated feedback
         */
        function showResponseState(isSuccess, message) {
            responseArea.classList.remove("hidden");
            responseText.innerText = message;

            if (isSuccess) {
                // Success styling (Trust-inspiring Green)
                responseArea.className = "rounded-2xl p-4.5 border border-emerald-300 bg-emerald-50 text-emerald-900 shadow-sm transition-all duration-300";
                responseBadge.innerText = "✅";
                responseStatusTitle.className = "text-xs font-bold uppercase tracking-wider text-emerald-700";
                responseStatusTitle.innerText = "सफलता (Success)";
            } else {
                // Error styling (Clear Red)
                responseArea.className = "rounded-2xl p-4.5 border border-rose-300 bg-rose-50 text-rose-900 shadow-sm transition-all duration-300";
                responseBadge.innerText = "❌";
                responseStatusTitle.className = "text-xs font-bold uppercase tracking-wider text-rose-700";
                responseStatusTitle.innerText = "त्रुटि (Error)";
            }
        }

        /**
         * Send Data to Webhook via Fetch API
         */
        async function sendData() {
            const text = userInput.value.trim();

            if (!text) {
                showResponseState(false, "कृपया पहले कुछ लिखें या बोलकर दर्ज करें!");
                userInput.focus();
                return;
            }

            // UI Loading state
            loader.classList.remove("hidden");
            responseArea.classList.add("hidden");
            sendBtn.disabled = true;
            sendBtn.classList.add("opacity-70", "cursor-not-allowed");
            sendIcon.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            sendLabel.innerText = "भेज रहे हैं...";

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) {
                    throw new Error(`Server returned status: ${response.status}`);
                }

                const result = await response.json();
                loader.classList.add("hidden");

                const isSuccess = Boolean(result.success);
                const message = result.message || (isSuccess ? "खाता सफलतापूर्वक अपडेट हो गया!" : "डेटा प्रोसेस नहीं हो सका।");

                showResponseState(isSuccess, message);

                if (isSuccess) {
                    userInput.value = "";
                    clearBtn.classList.add("hidden");
                }

                // Voice output: Speak out the response in Hindi
                speakMessage(message);

            } catch (error) {
                console.error("API transmission failure:", error);
                loader.classList.add("hidden");
                const errMsg = "सर्वर या इंटरनेट से संपर्क नहीं हो पाया। कृपया पुनः प्रयास करें।";
                showResponseState(false, errMsg);
                speakMessage(errMsg);
            } finally {
                // Restore Send Button
                sendBtn.disabled = false;
                sendBtn.classList.remove("opacity-70", "cursor-not-allowed");
                sendIcon.innerText = "🚀";
                sendLabel.innerText = "खाते में भेजें";
            }
        }
    </script>
</body>

</html>
